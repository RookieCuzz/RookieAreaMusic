name: RookieAreaMusic
version: @version@
main: com.gitee.niocho.areamusic.RookieAreaMusic
api-version: '1.21.4'
prefix: RookieAreaMusic
authors: [ niocho ]
description: "基于多边形切片区域的多频道音乐播放插件"
softdepend: [ CraftEngine ]
commands:
  am:
    description: 管理区域音乐、CT 切片区域和播放配置
    usage: /am <music|area|reload|help>
    permission: area-music.admin
permissions:
  area-music.admin:
    description: Allows management of RookieAreaMusic
    default: op
