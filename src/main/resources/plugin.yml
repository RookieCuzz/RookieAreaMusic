name: RookieAreaMusic
version: @version@
main: io.github.rookiecuzz.rookieareamusic.RookieAreaMusic
api-version: '1.21.4'
prefix: RookieAreaMusic
authors: [ RookieCuzz ]
website: https://github.com/RookieCuzz/RookieAreaMusic
description: "基于多边形切片区域的多频道音乐播放插件"
softdepend: [ CraftEngine, PlaceholderAPI ]
commands:
  am:
    description: 管理区域音乐、CT 切片区域和播放配置
    usage: /am <music|area|reload|help>
    permission: rookieareamusic.admin
permissions:
  rookieareamusic.admin:
    description: Allows management of RookieAreaMusic
    default: op
